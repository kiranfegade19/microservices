

spring:
  application:
    name: eureka-servicediscovery
  config:
    import: "optional:configserver:http://configurations:8000/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: eureka-servicediscovery
    description: "SmallBank serviceDiscovery service"
    version: "1.0.0"

logging:
  level:
    com:
      org:
        eureka_servicediscovery:
          eureka_servicediscovery: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"